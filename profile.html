<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Editor | VoltSense AI – EV Battery Health & Thermal Analytics Platform</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom External CSS -->
  <link rel="stylesheet" href="style.css">
  
  <!-- React 18 & Babel Standalone for direct browser rendering -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div class="page-wrapper">
    <!-- Header Component -->
    <header>
      <div class="container">
        <div class="header-brand">
          <div class="brand-icon">⚡</div>
          <h1 class="header-title">VoltSense AI</h1>
        </div>
        <p class="header-tagline">EV Battery Health & Thermal Analytics Platform</p>
      </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
      <div class="container">
        <a class="navbar-brand d-lg-none font-weight-bold text-cyan" href="index.html">VOLTSENSE AI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#voltNavbar" aria-controls="voltNavbar" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="voltNavbar">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="analytics.html">Analytics</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="alerts.html">Alerts</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="profile.html">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="tasks.html">Tasks</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="profile_manager.html">Profile Manager</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content Area where React Component Mounts -->
    <main class="py-4">
      <div class="container">
        <div id="react-profile-root"></div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer-custom mt-auto py-3 text-center text-muted-gray">
      <div class="container">
        <small>© 2026 VoltSense AI. All rights reserved.</small>
      </div>
    </footer>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- React Component Execution -->
  <script type="text/babel">
    const { useState } = React;

    function UserProfileEditor() {
      const initialValues = {
        name: '',
        age: '',
        email: '',
      };

      const [formData, setFormData] = useState(initialValues);
      const [isFormVisible, setIsFormVisible] = useState(true);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData((prev) => ({
          ...prev,
          [name]: value,
        }));
      };

      const handleReset = () => {
        setFormData(initialValues);
      };

      const toggleFormVisibility = () => {
        setIsFormVisible((prev) => !prev);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
      };

      return (
        <div style={styles.container}>
          {/* Header & Controls */}
          <div style={styles.headerRow}>
            <div>
              <h2 style={styles.title}>⚡ Operator Profile Editor</h2>
              <p style={styles.subtitle}>
                VoltSense AI Fleet Management & Technician Identity
              </p>
            </div>
            <button
              type="button"
              onClick={toggleFormVisibility}
              style={styles.btnSecondary}
            >
              {isFormVisible ? 'Hide Form' : 'Show Form'}
            </button>
          </div>

          {/* Form with toggleable visibility */}
          {isFormVisible && (
            <form onSubmit={handleSubmit} style={styles.formCard}>
              <div style={styles.formGroup}>
                <label style={styles.label} htmlFor="name">
                  Full Name
                </label>
                <input
                  id="name"
                  name="name"
                  type="text"
                  placeholder="e.g. Alex Mercer"
                  value={formData.name}
                  onChange={handleChange}
                  style={styles.input}
                  required
                />
              </div>

              <div style={styles.formGroup}>
                <label style={styles.label} htmlFor="age">
                  Age
                </label>
                <input
                  id="age"
                  name="age"
                  type="number"
                  placeholder="e.g. 32"
                  value={formData.age}
                  onChange={handleChange}
                  style={styles.input}
                  min="1"
                  max="120"
                  required
                />
              </div>

              <div style={styles.formGroup}>
                <label style={styles.label} htmlFor="email">
                  Email Address
                </label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="e.g. alex.mercer@voltsense.io"
                  value={formData.email}
                  onChange={handleChange}
                  style={styles.input}
                  required
                />
              </div>

              {/* Reset Button */}
              <div style={styles.buttonGroup}>
                <button
                  type="button"
                  onClick={handleReset}
                  style={styles.btnReset}
                >
                  Reset Form Fields
                </button>
              </div>
            </form>
          )}

          {/* Display entered information below the form */}
          <div style={styles.displayCard}>
            <h3 style={styles.displayTitle}>📋 Entered Profile Information</h3>
            <div style={styles.infoGrid}>
              <div style={styles.infoItem}>
                <span style={styles.infoLabel}>Name:</span>
                <span style={styles.infoValue}>
                  {formData.name.trim() ? formData.name : <em style={styles.placeholder}>Not entered</em>}
                </span>
              </div>

              <div style={styles.infoItem}>
                <span style={styles.infoLabel}>Age:</span>
                <span style={styles.infoValue}>
                  {formData.age !== '' ? `${formData.age} years` : <em style={styles.placeholder}>Not entered</em>}
                </span>
              </div>

              <div style={styles.infoItem}>
                <span style={styles.infoLabel}>Email:</span>
                <span style={styles.infoValue}>
                  {formData.email.trim() ? formData.email : <em style={styles.placeholder}>Not entered</em>}
                </span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const styles = {
      container: {
        maxWidth: '650px',
        margin: '20px auto',
        padding: '24px',
        backgroundColor: '#0a0f1d',
        color: '#e2e8f0',
        borderRadius: '12px',
        border: '1px solid #1e293b',
        boxShadow: '0 8px 32px rgba(0, 0, 0, 0.4)',
        fontFamily: "'Poppins', sans-serif",
      },
      headerRow: {
        display: 'flex',
        justifyContent: 'space-between',
        alignItems: 'center',
        marginBottom: '20px',
        flexWrap: 'wrap',
        gap: '12px',
      },
      title: {
        margin: 0,
        fontSize: '1.4rem',
        color: '#00f2fe',
        fontWeight: 600,
      },
      subtitle: {
        margin: '4px 0 0',
        fontSize: '0.85rem',
        color: '#94a3b8',
      },
      formCard: {
        backgroundColor: '#111827',
        padding: '20px',
        borderRadius: '8px',
        border: '1px solid #1f2937',
        marginBottom: '20px',
      },
      formGroup: {
        marginBottom: '16px',
        display: 'flex',
        flexDirection: 'column',
        gap: '6px',
      },
      label: {
        fontSize: '0.9rem',
        fontWeight: 500,
        color: '#cbd5e1',
      },
      input: {
        padding: '10px 14px',
        backgroundColor: '#1e293b',
        border: '1px solid #334155',
        borderRadius: '6px',
        color: '#f8fafc',
        fontSize: '0.95rem',
        outline: 'none',
      },
      buttonGroup: {
        display: 'flex',
        gap: '12px',
        marginTop: '10px',
      },
      btnSecondary: {
        padding: '8px 16px',
        backgroundColor: '#1e293b',
        border: '1px solid #4facfe',
        color: '#00f2fe',
        borderRadius: '6px',
        cursor: 'pointer',
        fontWeight: 500,
        fontSize: '0.88rem',
      },
      btnReset: {
        padding: '10px 18px',
        backgroundColor: 'rgba(239, 68, 68, 0.15)',
        border: '1px solid #ef4444',
        color: '#fca5a5',
        borderRadius: '6px',
        cursor: 'pointer',
        fontWeight: 500,
        fontSize: '0.9rem',
      },
      displayCard: {
        backgroundColor: '#111827',
        padding: '20px',
        borderRadius: '8px',
        border: '1px solid #1f2937',
      },
      displayTitle: {
        margin: '0 0 14px',
        fontSize: '1.1rem',
        color: '#4facfe',
        fontWeight: 600,
      },
      infoGrid: {
        display: 'flex',
        flexDirection: 'column',
        gap: '10px',
      },
      infoItem: {
        display: 'flex',
        justifyContent: 'space-between',
        padding: '8px 12px',
        backgroundColor: '#1e293b',
        borderRadius: '6px',
      },
      infoLabel: {
        fontWeight: 500,
        color: '#94a3b8',
        fontSize: '0.9rem',
      },
      infoValue: {
        fontWeight: 600,
        color: '#f8fafc',
        fontSize: '0.9rem',
      },
      placeholder: {
        color: '#64748b',
        fontStyle: 'italic',
      },
    };

    const root = ReactDOM.createRoot(document.getElementById('react-profile-root'));
    root.render(<UserProfileEditor />);
  </script>
</body>
</html>
